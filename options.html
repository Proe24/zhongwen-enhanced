<!DOCTYPE html>
<html data-direction="vellum" data-mode="light" data-density="regular" data-hanzi-font="serif">
<head>
    <title>Zhongwen Options</title>
    <meta charset="utf-8"/>
    <link rel="shortcut icon" href="images/zhongwen.png"/>
    <link rel="stylesheet" type="text/css" href="css/content.css"/>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="css/zhongwen.css"/>
</head>
<body>
<div class="container">
    <h1 class="my-3">Options for the Zhongwen Browser Extension</h1>

    <h2 class="mb-3">Appearance of the Pop-up Window</h2>

    <div class="form-group mb-4">
        <label>Visual direction</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="directionVellum" name="direction" class="custom-control-input"
                   value="vellum">
            <label class="custom-control-label" for="directionVellum">Vellum — warm cream paper
                with oxblood accents</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="directionSlate" name="direction" class="custom-control-input"
                   value="slate">
            <label class="custom-control-label" for="directionSlate">Slate — cool editorial
                off-white with deep blue accents</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="directionCrimson" name="direction" class="custom-control-input"
                   value="crimson">
            <label class="custom-control-label" for="directionCrimson">Crimson — workbook style
                with vermillion ink-stamp accents</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Color mode</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="modeLight" name="mode" class="custom-control-input"
                   value="light">
            <label class="custom-control-label" for="modeLight">Light</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="modeDark" name="mode" class="custom-control-input"
                   value="dark">
            <label class="custom-control-label" for="modeDark">Dark</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Popup density</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="densityCompact" name="density" class="custom-control-input"
                   value="compact">
            <label class="custom-control-label" for="densityCompact">Compact — smaller text,
                tighter spacing</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="densityRegular" name="density" class="custom-control-input"
                   value="regular">
            <label class="custom-control-label" for="densityRegular">Regular</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="densityComfy" name="density" class="custom-control-input"
                   value="comfy">
            <label class="custom-control-label" for="densityComfy">Comfy — larger text, more
                breathing room</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Definition detail</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="defViewFull" name="defView" class="custom-control-input"
                   value="full">
            <label class="custom-control-label" for="defViewFull">Full — show every meaning at
                once</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="defViewCompact" name="defView" class="custom-control-input"
                   value="compact">
            <label class="custom-control-label" for="defViewCompact">Compact — show only the most
                common meaning; press <kbd>D</kbd> in the popup to cycle through the rest,
                <kbd>F</kbd> for the full view</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label for="popupScale">Popup size <span id="popupScaleValue" style="color:var(--ink-faint);font-family:var(--font-mono);margin-left:8px"></span></label>
        <div style="display:flex;align-items:center;gap:12px;max-width:480px">
            <span style="font-size:11px;color:var(--ink-faint)">70%</span>
            <input type="range" id="popupScale" min="0.7" max="1.6" step="0.05" value="1"
                   style="flex:1">
            <span style="font-size:11px;color:var(--ink-faint)">160%</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="popupScaleReset">Reset</button>
        </div>
        <div id="popupPreviewArea" style="margin-top:16px;padding:24px;background:var(--bg-page-2,#ebe1c6);border:1px dashed var(--rule,#d4cba6);border-radius:6px;display:flex;justify-content:center;min-height:140px;overflow:hidden">
            <div id="popupPreview" class="cz-popup" style="position:relative;opacity:1;transform:none;pointer-events:auto">
                <div class="entry">
                    <div class="head">
                        <div class="hanzi"><span class="tone3">你</span><span class="tone3">好</span></div>
                        <div class="pinyin">nǐ hǎo</div>
                    </div>
                    <p class="def">hello; hi</p>
                </div>
            </div>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Hanzi font style</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziFontSerif" name="hanziFont" class="custom-control-input"
                   value="serif">
            <label class="custom-control-label" for="hanziFontSerif">Serif (Songti / Noto Serif
                SC)</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziFontSans" name="hanziFont" class="custom-control-input"
                   value="sans">
            <label class="custom-control-label" for="hanziFontSans">Sans-serif (Heiti / Noto Sans
                SC)</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>
            Tone coloring for pinyin and hanzi characters
        </label>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsSignature" name="toneColors"
                   class="custom-control-input" value="signature">
            <label class="custom-control-label" for="toneColorsSignature">Signature — adapts to
                the visual direction and color mode.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsStandard" name="toneColors"
                   class="custom-control-input" value="standard">
            <label class="custom-control-label" for="toneColorsStandard">Use the default color
                scheme.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsPleco" name="toneColors" class="custom-control-input"
                   value="pleco">
            <label class="custom-control-label" for="toneColorsPleco">Use the <a
                    href="https://pleco.com" target="_blank">Pleco</a> color scheme.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsHanping" name="toneColors"
                   class="custom-control-input" value="hanping">
            <label class="custom-control-label" for="toneColorsHanping">Use the <a
                    href="https://hanpingchinese.com/" target="_blank">Hanping</a> color
                scheme.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsNone" name="toneColors" class="custom-control-input"
                   value="none">
            <label class="custom-control-label" for="toneColorsNone">Don't show any tone
                colors.</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Simplified and traditional characters</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="simpTradClassic" name="simpTrad" class="custom-control-input"
                   value="classic">
            <label class="custom-control-label" for="simpTradClassic">Display both simplified and
                traditional characters.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="simpTradAuto" name="simpTrad" class="custom-control-input"
                   value="auto">
            <label class="custom-control-label" for="simpTradAuto">Use the character style
                automatically detected on the page (either simplified or traditional).</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Additional Chinese transliterations</label>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="zhuyin" name="zhuyin">
            <label class="custom-control-label" for="zhuyin">Show <a
                    href="https://wikipedia.org/wiki/Bopomofo" target="_blank">Zhuyin (Bopomofo)</a>
                phonetic symbols.</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Grammar and usage notes from the <a
                href="https://resources.allsetlearning.com/chinese/grammar" target="_blank">Chinese
            Grammar Wiki</a></label>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="grammar" name="grammar">
            <label class="custom-control-label" for="grammar">Show grammar and usage notes.</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Vocabulary notes from the <a
                href="https://resources.allsetlearning.com/chinese/vocabulary" target="_blank">Chinese
            Vocabulary Wiki</a></label>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="vocab" name="vocab">
            <label class="custom-control-label" for="vocab">Show vocabulary notes.</label>
        </div>
    </div>

    <h2 class="mb-3">Sentence Breakdown (AI)</h2>

    <div class="form-group mb-4">
        <label>AI provider for sentence breakdowns</label>
        <p class="text-muted" style="font-size:13px;margin-bottom:8px">
            Press <kbd>S</kbd> while the popup is showing to break down the surrounding sentence.
        </p>
        <div class="custom-control custom-radio">
            <input type="radio" id="providerGemini" name="aiProvider" class="custom-control-input"
                   value="gemini">
            <label class="custom-control-label" for="providerGemini">Google Gemini
                <strong style="color:var(--accent)">(free tier available)</strong> —
                <a href="https://aistudio.google.com/apikey" target="_blank">get key</a></label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="providerAnthropic" name="aiProvider" class="custom-control-input"
                   value="anthropic">
            <label class="custom-control-label" for="providerAnthropic">Anthropic Claude —
                <a href="https://console.anthropic.com/settings/keys" target="_blank">get key</a></label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="providerOpenai" name="aiProvider" class="custom-control-input"
                   value="openai">
            <label class="custom-control-label" for="providerOpenai">OpenAI ChatGPT —
                <a href="https://platform.openai.com/api-keys" target="_blank">get key</a></label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label id="apiKeyLabel">API key</label>
        <div class="input-group" style="max-width:480px">
            <input type="password" class="form-control" id="apiKey"
                   placeholder="">
            <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="button" id="saveApiKey">Save</button>
            </div>
        </div>
        <small id="apiKeyStatus" class="form-text" style="color:var(--ink-faint)"></small>
    </div>

    <h2 class="mb-3">Other Options</h2>

    <div class="form-group mb-4">
        <label>Saving entries to the <a
                href="https://github.com/cschiller/zhongwen/#built-in-word-list"
                target="_blank">Built-in Word List</a></label>
        <div class="custom-control custom-radio">
            <input type="radio" id="saveToWordListAllEntries" name="saveToWordList"
                   class="custom-control-input" value="allEntries">
            <label class="custom-control-label" for="saveToWordListAllEntries">Save all
                entries.</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="saveToWordListFirstEntryOnly" name="saveToWordList"
                   class="custom-control-input" value="firstEntryOnly">
            <label class="custom-control-label" for="saveToWordListFirstEntryOnly">Save only the
                first entry.</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>URL used for adding words to your <a href="https://skritter.com" target="_blank">Skritter</a>
            queue (Skritter subscription required)</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="skritterTLDcom" name="skritterTLD" class="custom-control-input"
                   value="com">
            <label class="custom-control-label" for="skritterTLDcom">skritter.com</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="skritterTLDcn" name="skritterTLD" class="custom-control-input"
                   value="cn">
            <label class="custom-control-label" for="skritterTLDcn">skritter.cn</label>
        </div>
    </div>
</div>
<script src="js/storage.js" type="text/javascript"></script>
<script src="js/options.js" type="text/javascript"></script>
</body>
</html>
